services:
  - type: web
    name: ipo-tracker
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
      - key: SYNC_INTERVAL_MS
        value: "300000"
